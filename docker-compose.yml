services:
  camofox:
    image: ghcr.io/redf0x1/camofox-browser:latest
    volumes:
      - camofox_data:/root/.camofox
    environment:
      - TZ=Pacific/Auckland
      - CAMOFOX_HOST=0.0.0.0
      - CAMOFOX_PORT=9377
      - CAMOFOX_AUTH_MODE=disabled
      - CAMOFOX_IDLE_TIMEOUT_MS=86400000
      - CAMOFOX_IDLE_EXIT_TIMEOUT_MS=86400000
    networks:
      - aether-net
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  searxng:
    image: searxng/searxng:latest
    volumes:
      - searxng_data:/etc/searxng
    configs:
      - source: searxng_settings
        target: /etc/searxng/settings.yml
      - source: searxng_limiter
        target: /etc/searxng/limiter.toml
    environment:
      - TZ=Pacific/Auckland
    networks:
      - aether-net
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  flaresolverr:
    image: ghcr.io/thephaseless/byparr:latest
    environment:
      - TZ=Pacific/Auckland
      - LOG_LEVEL=INFO
    networks:
      - aether-net
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  camofox_data:
  searxng_data:

networks:
  aether-net:
    external: true

configs:
  searxng_settings:
    file: ./config/searxng/settings.yml
  searxng_limiter:
    file: ./config/searxng/limiter.toml
