services:
  camofox:
    image: ghcr.io/redf0x1/camofox-browser:latest
    volumes:
      - camofox_data:/root/.camofox
    environment:
      - TZ=Pacific/Auckland
      - CAMOFOX_HOST=0.0.0.0
      - CAMOFOX_PORT=9377
      - CAMOFOX_AUTH_MODE=disabled
      - CAMOFOX_IDLE_TIMEOUT_MS=86400000
      - CAMOFOX_IDLE_EXIT_TIMEOUT_MS=86400000
    networks:
      - aether-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  searxng:
    image: searxng/searxng:latest
    volumes:
      - searxng_data:/etc/searxng
    configs:
      - source: searxng_settings
        target: /etc/searxng/settings.yml
      - source: searxng_limiter
        target: /etc/searxng/limiter.toml
    environment:
      - TZ=Pacific/Auckland
    networks:
      - aether-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  flaresolverr:
    image: ghcr.io/thephaseless/byparr:latest
    environment:
      - TZ=Pacific/Auckland
      - LOG_LEVEL=INFO
    networks:
      - aether-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  browserless:
    image: ghcr.io/browserless/chromium:latest
    volumes:
      - browserless_data:/data
    environment:
      - TZ=Pacific/Auckland
      - CONCURRENT=5
      - TIMEOUT=60000
    networks:
      - aether-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  playwright:
    image: mcr.microsoft.com/playwright/mcp:latest
    entrypoint: ["node"]
    command: ["/app/cli.js", "--headless", "--browser", "chromium", "--no-sandbox", "--host", "0.0.0.0", "--port", "8931"]
    environment:
      - TZ=Pacific/Auckland
    networks:
      - aether-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  camofox_data:
  searxng_data:
  browserless_data:

networks:
  aether-net:
    external: true

configs:
  searxng_settings:
    name: searxng_settings_${SEARXNG_SETTINGS_HASH}
    file: ./config/searxng/settings.yml
  searxng_limiter:
    name: searxng_limiter_${SEARXNG_LIMITER_HASH}
    file: ./config/searxng/limiter.toml
