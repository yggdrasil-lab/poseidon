name: Deploy Poseidon

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, gaia]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Deploy Stack
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          STACK_NAME: poseidon
          SEARXNG_SECRET: ${{ vars.SEARXNG_SECRET || '' }}
        run: |
          # Generate SearXNG secret key for session signing (stable across deploys if set as GitHub var)
          if [ -z "${SEARXNG_SECRET}" ]; then
            export SEARXNG_SECRET=$(openssl rand -hex 32)
            echo "SEARXNG_SECRET=${SEARXNG_SECRET}" >> $GITHUB_ENV
          fi
          python3 -c "import os; open('config/searxng/settings.yml', 'w').write(os.path.expandvars(open('config/searxng/settings.yml.template').read()))"

          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh "poseidon" docker-compose.yml
